# สร้างเว็บ Flood real แบบ static แล้ว deploy ขึ้น GitHub Pages + Cloudflare Pages ทุก 15 นาที
name: Build & deploy site

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # ทุก 15 นาที (เลี่ยงนาทีที่ 0 ซึ่งคิวแน่น)
  workflow_dispatch:
  push:                         # push โค้ดขึ้น main -> สร้างเว็บใหม่ทันที
    branches: [main]
    paths-ignore: ["README.md", "tools/probe*", ".github/workflows/probe.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Build site
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          BUS_DIR: ${{ runner.temp }}/bus
          SITE_EVERY_MINUTES: "15"
          PREV_SITE_URL: https://mapoko11.github.io/Flood-Real   # ใช้ GISTDA รอบก่อน ไม่ยิงซ้ำทุก 15 นาที
          TRAFFIC_PROXY_URL: https://floodreal-proxy.cheabracha0920.workers.dev   # Worker ซ่อน key TomTom
          LONGDO_WEB_KEY: ${{ secrets.LONGDO_API_KEY }}
          TZ: Asia/Bangkok          # เวลาไทย (เว็บ + ช่วง 72 ชม. ของ Traffy)
        run: python tools/build_static.py
      # ส่งเว็บชุดเดียวกันขึ้น Cloudflare Pages ด้วย (ทดสอบคู่กับ GitHub Pages ซึ่ง deploy ไม่ขึ้นเว็บตั้งแต่ ~5 พ.ย. 2569)
      # ล้มเหลว = ไม่กระทบขั้น GitHub Pages (continue-on-error)
      - name: Check Cloudflare secrets
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token length: ${#CF_TOKEN}, account id length: ${#CF_ACC}"
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACC" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; fi
      # Cloudflare Pages รับไฟล์ได้ไม่เกิน 25 MiB ต่อไฟล์ -> ทำสำเนา site_cf แล้วย่อไฟล์ใหญ่ (ปัดพิกัดเหลือ 4 ตำแหน่ง ~11 ม.)
      # ถ้ายังใหญ่เกินจึงตัดไฟล์นั้นออกเฉพาะฝั่ง Cloudflare (GitHub Pages ใช้ไฟล์เต็มเหมือนเดิม)
      - name: Prepare Cloudflare copy
        if: steps.cf.outputs.has == 'true'
        continue-on-error: true
        shell: python
        run: |
          import json, os, re, shutil
          LIMIT = 24 * 1024 * 1024
          shutil.rmtree("site_cf", ignore_errors=True)
          shutil.copytree("site", "site_cf")
          rnd = lambda m: repr(round(float(m.group(0)), 4))
          for root, _, files in os.walk("site_cf"):
              for n in files:
                  f = os.path.join(root, n)
                  size = os.path.getsize(f)
                  if size <= LIMIT:
                      continue
                  if n.endswith(".json"):
                      txt = open(f, encoding="utf-8").read()
                      txt = re.sub(r"-?\d+\.\d{5,}", rnd, txt)
                      open(f, "w", encoding="utf-8").write(txt)
                  new = os.path.getsize(f)
                  print(f"{f}: {size/1048576:.1f} MiB -> {new/1048576:.1f} MiB")
                  if new > LIMIT:
                      os.remove(f)
                      print(f"  still too big, removed from Cloudflare copy")
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.has == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_cf --project-name=flood-real --branch=main --commit-dirty=true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10         # กัน deploy ค้างจนรอบถัดไปถูกยกเลิกทั้งหมด (เหตุการณ์ 6-9 ต.ค.)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# สร้างเว็บ Flood real แบบ static แล้ว deploy ขึ้น GitHub Pages ทุก 30 นาที
name: Build & deploy site

on:
  schedule:
    - cron: "7,37 * * * *"      # ทุก 30 นาที (นาทีที่ 7 และ 37 เลี่ยงช่วงคิวแน่น)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Build site
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          BUS_DIR: ${{ runner.temp }}/bus
          SITE_EVERY_MINUTES: "30"
        run: python tools/build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
